<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Notícia</title>

    
    <link rel="stylesheet" href="styles/index.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <header class="container">
        <nav id="primary" class="grid grid-flow-col">
            <div>
                <img src="assets/icones/List.svg" alt="icone de menu">
                <strong>Menu</strong>
            </div>

            <div>
              <img src="assets/logo/Logo.svg" alt="Tech news logo">  
            </div>

            <div>
                <strong>Buscar</strong>
                <img src="assets/icones/MagnifyingGlass.svg" alt="Lupa icone">
            </div>
        </nav>
                
        <nav id="secundary" class="grid grid-flow-col">
        <a href="#">Inteligência Artificial</a>
        <a href="#">Blockchain</a>
        <a href="#">Hologramas</a>
        <a href="#">Internet</a>
        <a href="#">Vestíveis</a>
        <a href="#">Realidade Aumentada</a>
        <a href="#">Realidade  Virtual</a>
        </nav>
        
        
    </header>

     <!--imagens do container  -->

    <main class="grid container">
        <section id="featured" class="grid grid-flow-col gap-16">
            <figure class="card">
                <img src="assets/img/Image 01.png" alt="robotica">

                <figcaption>
                    <span class="content-tag">robótica</span>
                    <h2 class="text-2xl">
                      Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.  
                    </h2>
                </figcaption>

            </figure>
           
            


            <figure class="grid grid-cols-2 gap-16">                                                                <!-- Faz o figure ter um grid com 2 colunas e gap de 16px entre os elementos filhos -->
                <figure class="card">
                  <img src="assets/img/Image 02.png" alt="hologramas">

                   <figcaption>
                    <span class="content-tag">Hologramas</span>
                    <h2 class="text-lg">
                      Novo Smartphone Projetor 3D chega ao mercado, transformando a forma como vemos nossas telas! 
                    </h2>
                </figcaption>
                
            </figure>

                <figure class="card">    
                  <img src="assets/img/Image 03.png" alt="internet">

                   <figcaption>
                    <span class="content-tag">Internet</span>
                    <h2 class="text-lg">
                      Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comunicamos.
                    </h2>
                
                </figcaption>
                </figure>

                <figure class="card">
                  <img src="assets/img/Image 04.png" alt="vestíves">

                   <figcaption>
                    <span class="content-tag">Vestíveis</span>
                    <h2 class="text-lg">
                      Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o bem-estar pessoal.
                    </h2>
                
                </figcaption>
                </figure>

                <figure class="card">
                  <img src="assets/img/Image 05.png" alt="realidade virtual">

                   <figcaption>
                    <span class="content-tag">Realidade Virtual</span>
                    <h2 class="text-lg">
                     Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradicional.
                    </h2>
                </figcaption>
                
            </figure>

            </figure>

        </section>

    </main>
        
        </body>
        </html>
